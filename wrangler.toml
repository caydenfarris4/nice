name = "nice"
main = ".open-next/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Static assets generated by OpenNext (CSS/JS bundles, images, etc).
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# D1 database (Cloudflare hosted SQLite).
# After running `npx wrangler d1 create nice`, paste the database_id below.
[[d1_databases]]
binding = "DB"
database_name = "nice"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# Set ANTHROPIC_API_KEY as a secret with:
#   npx wrangler secret put ANTHROPIC_API_KEY
# Or in the Cloudflare dashboard for the Worker.
[vars]
ANTHROPIC_MODEL = "claude-opus-4-7"
